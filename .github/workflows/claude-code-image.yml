name: Claude Code image

# Builds docker/Dockerfile.claude_code and pushes it to
# ghcr.io/<owner>/pr-agent-claude-code (tags: latest, sha-<short sha>).
on:
  push:
    branches: [main]
    paths:
      - "pr_agent/**"
      - "docker/Dockerfile.claude_code"
      - "docker/claude_code_healthcheck.sh"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/claude-code-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: claude-code-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests for the Claude Code handler
        run: |
          pip install uv
          uv sync --frozen
          PYTHONPATH=. uv run pytest -q tests/unittest/test_claude_code_ai_handler.py tests/unittest/test_config_reference.py

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: names
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pr-agent-claude-code" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.claude_code
          push: true
          tags: |
            ${{ steps.names.outputs.image }}:latest
            ${{ steps.names.outputs.image }}:sha-${{ steps.names.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker run --rm --entrypoint sh ${{ steps.names.outputs.image }}:latest -c \
            'claude --version && python -c "from pr_agent.algo.ai_handlers.claude_code_ai_handler import ClaudeCodeAIHandler"'
